name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On annule les runs empilés sur une branche. Plus de run de tag à ménager : la
# publication vit dans `release.yml`, qui a sa propre concurrence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-front:
    name: Lint front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ESLint (règles d'accessibilité des templates incluses) + vérification Prettier,
      # qui couvre aussi les fichiers de ce workflow.
      - run: npm run lint

      # Le générateur de notes de release n'est ni Angular ni Rust : son runner est celui
      # de Node, sans dépendance à installer.
      - run: npm run test:scripts

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu

      # `generate_context!` lit frontendDist à la compilation. Faire dépendre ce job du
      # build front le sérialiserait pour rien : il valide du Rust, pas le bundle.
      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devbox/browser
          printf '<!doctype html><title>ci</title>' > dist/devbox/browser/index.html

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build-front:
    name: Build front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ hashFiles('package-lock.json') }}-
            angular-

      - run: npm ci

      - name: Build
        run: |
          start=$(date +%s)
          npm run build
          echo "\`build-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # Pas consommé par `test-front` : la cible `test` d'angular.json refait sa propre build
      # dev (buildTarget "::development"). Conservé court, comme preuve et pour le debug.
      - uses: actions/upload-artifact@v4
        with:
          name: front-dist
          path: dist/devbox/browser
          retention-days: 1

  build-rust:
    name: Build Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Seul job autorisé à écrire le cache cargo, pour que `test-rust` le lise sans course.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu
          save-if: 'true'

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devbox/browser
          printf '<!doctype html><title>ci</title>' > dist/devbox/browser/index.html

      - name: Build
        run: |
          start=$(date +%s)
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          echo "\`build-rust\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  test-front:
    name: Test front
    needs: build-front
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Lecture seule : le cache a été écrit par `build-front`, dont le post-step est terminé.
      - uses: actions/cache/restore@v4
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ hashFiles('package-lock.json') }}-
            angular-

      - run: npm ci

      # Les seuils de couverture à 80 % font la garde.
      - name: Test
        run: |
          start=$(date +%s)
          npm run test:coverage
          echo "\`test-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-coverage
          path: coverage
          retention-days: 7

  test-rust:
    name: Test Rust
    needs: build-rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Restaure le target/ de `build-rust` — dont la compilation de SQLite
      # (`libsqlite3-sys` en `bundled` compile les sources C), qui est l'essentiel
      # du temps de ce job.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devbox/browser
          printf '<!doctype html><title>ci</title>' > dist/devbox/browser/index.html

      - name: Test
        run: |
          start=$(date +%s)
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          echo "\`test-rust\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  # Le seul job qui lance l'application assemblée : vrai binaire, vraie WebView,
  # vraie base SQLite sur disque. Les deux plateformes de la matrice de release
  # sont couvertes, et elles ne cassent pas de la même façon : la WebView est
  # WebView2 sur Windows et WebKitGTK sur Linux, et surtout Windows confond
  # `data_dir()` et `config_dir()` (tous deux `%APPDATA%\<id>`) là où Linux les
  # sépare. C'est le seul runner capable de démentir un chemin : il a déjà
  # attrapé un `preferences.json` cherché au mauvais endroit.
  #
  # `continue-on-error` volontairement : un job E2E instable que tout le monde
  # ignore vaut moins que pas de job du tout. À retirer une fois qu'il a fait ses
  # preuves sur quelques dizaines de runs.
  test-e2e:
    name: Test E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # L'étape apt de l'action installe les dépendances Tauri sur Linux ; sur
      # Windows elle ne pose que la toolchain et le cache cargo.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e-${{ matrix.os }}
          save-if: 'true'

      # WebKitGTK a besoin d'un serveur X : sans lui la fenêtre ne s'ouvre pas et
      # le serveur WebDriver embarqué n'écoute jamais.
      - name: Serveur X virtuel
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb

      - run: npm ci

      # `tauri build` enchaîne `beforeBuildCommand` (le build front e2e) puis cargo.
      # Le binaire produit porte l'identifiant `com.devbox.app.e2e`, donc son profil
      # est à lui : il ne peut pas écraser une bibliothèque existante.
      - name: Build the e2e binary
        run: |
          start=$(date +%s)
          npm run e2e:build
          echo "\`build-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # `xvfb-run` enveloppe le runner et non le binaire : c'est le service wdio qui
      # lance l'application, depuis son propre `onPrepare`, donc le DISPLAY doit
      # exister pour tout le processus.
      - name: Run the scenarios
        run: |
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
          echo "\`test-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # `E2E_LOG_LEVEL=trace` à la main sur un run en échec : par défaut les logs
      # restent lisibles, et une session qui refuse de s'ouvrir se diagnostique en
      # relançant le job avec la variable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e/logs
          retention-days: 7
