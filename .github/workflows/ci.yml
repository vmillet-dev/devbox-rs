name: CI

on:
  push:
    branches: [main]
  # `folders` is the v0.3.0 integration branch: its five slice PRs target it rather than
  # main, and would otherwise merge unchecked. Drop it once the milestone lands.
  pull_request:
    branches: [main, folders]

# Stacked runs on a branch are cancelled. No tag run to spare any more: publishing lives
# in `release.yml`, which has a concurrency group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-front:
    name: Lint front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # ESLint (template accessibility rules included) plus the Prettier check, which also
      # covers this workflow file.
      - run: npm run lint

      # The release-notes generator is neither Angular nor Rust: its runner is Node's own,
      # with no dependency to install.
      - run: npm run test:scripts

  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu

      # `generate_context!` reads frontendDist at compile time. Making this job depend on the
      # front-end build would serialise it for nothing: it validates Rust, not the bundle.
      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devbox/browser
          printf '<!doctype html><title>ci</title>' > dist/devbox/browser/index.html

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `--all-features` is what type-checks the `e2e` feature. Without it a break in
      # the end-to-end harness only surfaces at the next `npm run e2e:build`.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

  build-front:
    name: Build front
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/cache@v6
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ hashFiles('package-lock.json') }}-
            angular-

      - run: npm ci

      - name: Build
        run: |
          start=$(date +%s)
          npm run build
          echo "\`build-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # Not consumed by `test-front`: angular.json's `test` target rebuilds its own dev build
      # (buildTarget "::development"). Kept short, as evidence and for debugging.
      - uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: dist/devbox/browser
          retention-days: 1

  build-rust:
    name: Build Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The only job allowed to write the cargo cache, so `test-rust` reads it without racing.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: rust-ubuntu
          save-if: 'true'

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devbox/browser
          printf '<!doctype html><title>ci</title>' > dist/devbox/browser/index.html

      - name: Build
        run: |
          start=$(date +%s)
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          echo "\`build-rust\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  test-front:
    name: Test front
    needs: build-front
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Read-only: the cache was written by `build-front`, whose post-step has finished.
      - uses: actions/cache/restore@v6
        with:
          path: .angular/cache
          key: angular-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            angular-${{ hashFiles('package-lock.json') }}-
            angular-

      - run: npm ci

      # The 80% coverage thresholds are the guard.
      - name: Test
        run: |
          start=$(date +%s)
          npm run test:coverage
          echo "\`test-front\` — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-coverage
          path: coverage
          retention-days: 7

  # ⚠️ Windows is not redundant with Ubuntu here. DevBox ships primarily to Windows, and the
  # back-end reasons about `app_data_dir()`, path separators, file locking and SQLite — all of
  # which differ. Until this leg existed, nothing blocking ever ran the tests on the platform
  # most users are on: `test-e2e` covers Windows but is `continue-on-error`.
  test-rust:
    name: Test Rust (${{ matrix.os }})
    # `needs` is per job, not per matrix leg, so the Windows leg waits on a build whose
    # cache it does not read. Deliberate: splitting it into a second job to save that
    # minute would duplicate five steps, and `test-e2e` (about seven) is the critical
    # path either way. Dropping `needs` instead would race the Ubuntu leg against the
    # cache it exists to reuse.
    needs: build-rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # `rust-ubuntu` on purpose: the same key `build-rust` wrote, which is the whole
          # point of depending on it.
          - os: ubuntu-22.04
            cache-key: rust-ubuntu
            save-cache: 'false'
          - os: windows-latest
            cache-key: rust-windows
            save-cache: 'true'
    steps:
      - uses: actions/checkout@v7

      # On Ubuntu this restores `build-rust`'s target/ — including the SQLite compilation
      # (`libsqlite3-sys` in `bundled` builds the C sources), which is most of this job's
      # time. Windows has no such job ahead of it, so it seeds a cache of its own; the two
      # keys differ, so neither races the other for a write.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: ${{ matrix.cache-key }}
          save-if: ${{ matrix.save-cache }}

      - name: Placeholder frontendDist
        run: |
          mkdir -p dist/devbox/browser
          printf '<!doctype html><title>ci</title>' > dist/devbox/browser/index.html

      - name: Test
        run: |
          start=$(date +%s)
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          echo "\`test-rust\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

  # The only job that launches the assembled application: real binary, real WebView, real
  # SQLite file on disk. Both platforms of the release matrix are covered, and they do not
  # break the same way: the WebView is WebView2 on Windows and WebKitGTK on Linux, and above
  # all Windows conflates `data_dir()` and `config_dir()` (both `%APPDATA%\<id>`) where Linux
  # keeps them apart. It is the only runner able to disprove a path — it has already caught a
  # `preferences.json` looked for in the wrong place.
  #
  # ⚠️ Blocking, and it was not always. `continue-on-error: true` stood here to buy the suite
  # time to prove itself, and the bill came due: on `main` at `e4ed5d9` the Ubuntu leg failed
  # on a real bug — a note keeping its title and losing the body typed after it — and the run
  # was reported `success` all the same. `gh run list` said success, the badge said passing,
  # and the failure sat there across three merges until someone went looking for it by hand.
  #
  # A job whose failure reads as a pass is worse than no job: it is a claim that nothing is
  # wrong. So the flag is gone. The cost is the one it was avoiding — a genuinely flaky run
  # blocks a merge until it is re-run — and that is the right way round.
  test-e2e:
    name: Test E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The action's apt step installs the Tauri dependencies on Linux; on Windows it only
      # lays down the toolchain and the cargo cache.
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: e2e-${{ matrix.os }}
          save-if: 'true'

      # WebKitGTK needs an X server: without one the window never opens and the embedded
      # WebDriver server never listens.
      - name: Virtual X server
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb

      - run: npm ci

      # `tauri build` chains `beforeBuildCommand` (the e2e front-end build) then cargo. The
      # binary it produces carries the `com.devbox.app.e2e` identifier, so its profile is its
      # own: it cannot overwrite an existing library.
      - name: Build the e2e binary
        run: |
          start=$(date +%s)
          npm run e2e:build
          echo "\`build-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # `xvfb-run` wraps the runner, not the binary: the wdio service is what launches the
      # application, from its own `onPrepare`, so DISPLAY has to exist for the whole process.
      - name: Run the scenarios
        run: |
          start=$(date +%s)
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run test:e2e
          else
            npm run test:e2e
          fi
          echo "\`test-e2e\` (${{ matrix.os }}) — $(($(date +%s) - start)) s" >> "$GITHUB_STEP_SUMMARY"

      # `E2E_LOG_LEVEL=trace` by hand on a failing run: by default the logs stay readable, and
      # a session that refuses to open is diagnosed by re-running the job with the variable.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e/logs
          retention-days: 7
