version: 2

# Grouped and monthly on purpose. A stream of one-crate pull requests is a stream
# nobody reviews; the security workflow is what catches anything urgent in between.
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
      rust-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*/*'
          - 'angular-eslint'
      npm-minor:
        update-types:
          - minor
          - patch

  # Pinned action versions go stale silently: nothing in a green run says an action
  # is two majors behind.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
