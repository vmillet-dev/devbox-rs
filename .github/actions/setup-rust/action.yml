name: Setup Rust
description: Dépendances système Tauri, toolchain Rust et cache cargo partagé entre les jobs.

inputs:
  shared-key:
    description: Clé du cache cargo. Les jobs qui compilent la même chose doivent partager la même valeur.
    required: true
  save-if:
    description: "'true' pour le seul job autorisé à écrire le cache ; les autres le lisent."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # webkit2gtk-4.1 n'existe qu'à partir d'Ubuntu 22.04 ; patchelf est requis par le bundler AppImage.
    - name: Dépendances système Tauri
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
          librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    # `workspaces` est obligatoire : le projet Cargo est dans src-tauri/, pas à la racine.
    # Sans lui l'action ne trouve rien et le cache reste vide sans le signaler.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
