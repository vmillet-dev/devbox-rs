name: Setup Rust
description: Dépendances système Tauri, toolchain Rust et cache cargo partagé entre les jobs.

inputs:
  shared-key:
    description: >-
      Clé du cache cargo. Deux jobs ne doivent la partager que s'ils produisent les mêmes
      artefacts : `cargo clippy` s'arrête aux `.rmeta`, `cargo test` va jusqu'aux rlib et
      aux binaires. Sous une clé commune, chacun restaure ce que l'autre a écrit et
      recompile tout de son côté.
    required: true
  save-if:
    description: "'true' pour un job autorisé à écrire le cache ; les autres le lisent."
    required: false
    default: 'false'
  bundle:
    description: >-
      'true' pour installer en plus ce dont l'empaqueteur AppImage a besoin. Compiler et
      tester n'en demandent rien, et ces paquets coûtent une bonne partie du `apt-get`.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # webkit2gtk-4.1 n'existe qu'à partir d'Ubuntu 22.04. `build-essential` et `curl` sont
    # déjà sur l'image GitHub ; les réclamer ne fait qu'allonger la résolution apt.
    - name: Dépendances système Tauri
      if: runner.os == 'Linux'
      shell: bash
      run: |
        packages="libayatana-appindicator3-dev libgtk-3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev"
        # patchelf et librsvg2-dev ne servent qu'à fabriquer l'AppImage, pas à compiler.
        if [ '${{ inputs.bundle }}' = 'true' ]; then
          packages="$packages file librsvg2-dev patchelf wget"
        fi
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $packages

    # Version lue depuis `rust-toolchain.toml` plutôt qu'écrite ici : deux endroits
    # finiraient par diverger, et c'est justement la dérive que l'épinglage évite.
    - name: Version de la toolchain
      id: toolchain
      shell: bash
      run: |
        channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "Toolchain épinglée : $channel"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: clippy, rustfmt

    # `workspaces` est obligatoire : le projet Cargo est dans src-tauri/, pas à la racine.
    # Sans lui l'action ne trouve rien et le cache reste vide sans le signaler.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
        # Un clippy en échec, c'est une PR qu'on va repousser : sans ce drapeau, aucune
        # des tentatives suivantes ne repart d'un cache et chacune recompile à froid.
        cache-on-failure: 'true'
