[package]
name = "devbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Sérialisation des structures échangées avec le front (voir commands/notes.rs).
serde = { version = "1", features = ["derive"] }
# Stockage : SQLite embarqué (voir storage/mod.rs). La feature `bundled` compile
# SQLite depuis les sources et le lie en statique — aucune DLL à distribuer.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Identifiants des notes et des espaces : le front n'en fabrique jamais.
uuid = { version = "1.24.0", features = ["v4"] }
# Horodatages ISO 8601 / RFC 3339 UTC, le format attendu par le pont Tauri.
chrono = "0.4.45"

[dev-dependencies]
# Uniquement pour verrouiller par test la forme JSON traversant le pont Tauri
# (voir les tests de commands/notes.rs). Tauri sérialise lui-même en production.
serde_json = "1.0.151"

