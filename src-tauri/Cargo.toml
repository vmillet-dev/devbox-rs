[package]
name = "devbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Sérialisation des structures échangées avec le front (voir domain/note.rs).
serde = { version = "1", features = ["derive"] }
# Exigé par `generate_context!` depuis que tauri.conf.json porte une section
# `plugins` : la macro embarque cette configuration sous forme de JSON. Sert
# aussi aux tests, qui verrouillent la forme traversant le pont (domain/note.rs).
serde_json = "1.0.151"
# Stockage : SQLite embarqué (voir storage/mod.rs). La feature `bundled` compile
# SQLite depuis les sources et le lie en statique — aucune DLL à distribuer.
rusqlite = { version = "0.40.1", features = ["bundled"] }
# Identifiants des notes et des espaces : le front n'en fabrique jamais.
uuid = { version = "1.24.0", features = ["v4"] }
# Horodatages ISO 8601 / RFC 3339 UTC, le format attendu par le pont Tauri.
chrono = "0.4.45"
# Redémarrage de l'application après l'installation d'une mise à jour.
tauri-plugin-process = "2"
# Ouverture du dépôt dans le navigateur système. Le CSP est verrouillé sur
# `'self'` : un lien ordinaire ne mène nulle part depuis la WebView.
tauri-plugin-opener = "2"

# L'updater n'existe pas sur mobile — les magasins d'applications s'en chargent —
# et le déclarer inconditionnellement casserait une compilation Android/iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Le Rust n'avait ni linter ni garde-fou : `cargo clippy -- -D warnings` échouait
# sur rien, donc rien n'empêchait une régression d'entrer.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# `priority = -1` laisse la possibilité de rétrograder une lint précise ensuite.
all = { level = "deny", priority = -1 }

