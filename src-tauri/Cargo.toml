[package]
name = "devbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Sérialisation des structures échangées avec le front (voir commands/notes.rs).
serde = { version = "1", features = ["derive"] }
# TODO(persistance) : les dépendances du stockage restent à choisir.
# Les plus probables : `serde_json` (stockage fichier), `uuid` (identifiants),
# `chrono` (horodatages ISO 8601), ou `rusqlite` pour une base SQLite.

