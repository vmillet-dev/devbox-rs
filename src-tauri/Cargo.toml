[package]
name = "devbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# Le binaire `export-bindings` en fait un second : sans cette clé, le `cargo run`
# nu que lance `tauri dev` ne sait plus lequel démarrer.
default-run = "devbox"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Génération des types et des appels TypeScript à partir des signatures Rust
# (voir lib.rs). Versions figées par `=` : Specta v2 est en release candidate et
# ne garantit pas la compatibilité entre deux rc.
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
diesel = { version = "2.3.12", features = ["sqlite"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
# Dépendance directe uniquement pour `bundled` : diesel tire `libsqlite3-sys`
# sans l'activer, et sans elle il faudrait un SQLite système sur la machine de
# build comme sur celle de l'utilisateur.
libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = "0.4.45"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

