[package]
name = "devbox"
version = "0.1.4"
# ⚠️ Shipped: the installer and the Linux `.desktop` entry show this string.
description = "A developer's notes and snippets manager for the desktop"
authors = ["Valentin MILLET"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/vmillet-dev/devbox-rs"
license = "GPL-3.0-only"
readme = "../README.md"
default-run = "devbox"
# ⚠️ Off, and the [[bench]] table below is why. Cargo would otherwise discover every
# benches/*.rs as a target of its own — including the shared corpus, which is a module
# and not a benchmark, and which clippy then reports as entirely unused.
autobenches = false

# Both binaries are auto-discovered; these tables exist only to turn the built-in
# harness off, for the reason given on [lib].
[[bin]]
name = "devbox"
path = "src/main.rs"
bench = false

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
bench = false

[package.metadata.devbox]
display-name = "DevBox"
author-handle = "@vmillet-dev"

[lib]
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# ⚠️ The lib carries no benchmarks, but cargo gives every target the built-in test
# harness by default and runs it first — which then rejects criterion's own flags with
# "Unrecognized option: save-baseline".
bench = false

[features]
# The end-to-end harness, and nothing else. Off by default, so a release build
# never links the test plugin into the shipped binary.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "1.1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["chrono"] }
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
diesel = { version = "2.3.12", features = ["sqlite"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
png = "0.18.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
log = "0.4"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
# Pulled in only by the `e2e` feature, and not optional in practice: the runner
# waits on `window.wdioTauri` before it will open a session, so a binary without
# the plugin hangs the suite rather than failing it. Its Rust half and the npm half
# (`polyfills` in the `e2e` Angular configuration) go together — with one but not
# the other, the front end invokes `plugin:wdio|…` commands nothing answers and the
# error banner comes up on launch.
#
# ⚠️ Both crates, not one: the documentation presents `-webdriver` as needed by the
# embedded driver provider alone, but it also serves the HTTP endpoint the runner's
# `DirectEvalClient` posts to.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# Desktop-only plugins. They are plain dependencies rather than a
# `cfg(not(android/ios))` table: DevBox targets the desktop, and a conditional table
# only pretended the crate could build anywhere else.
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# ⚠️ The first dev-dependency, and `deny.toml` sets `all-features = true`, so cargo-deny
# inspects this tree too: criterion's dependencies answer to the licence allow-list.
#
# criterion and not divan, for the one reason that decides it: `--save-baseline` and
# `--baseline`. A baseline is only worth keeping if a later state can be compared to it in
# one command.
[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# `harness = false`: criterion brings its own main.
[[bench]]
name = "commands"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

