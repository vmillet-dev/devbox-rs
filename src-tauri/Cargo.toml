[package]
name = "devbox"
version = "0.1.2"
description = "Couteau suisse de développeur : prise de notes, hachage, encodage"
authors = ["Valentin MILLET"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/vmillet-dev/devbox-rs"
default-run = "devbox"

[package.metadata.devbox]
display-name = "DevBox"
author-handle = "@vmillet-dev"

[lib]
name = "devbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "0.9"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["chrono"] }
specta-typescript = "=0.0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
diesel = { version = "2.3.12", features = ["sqlite"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.22.1"
png = "0.17.16"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
log = "0.4"
thiserror = "2.0.20"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

