<div class="about-wrapper">
  <button
    appMenuAnchor
    type="button"
    class="about-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    (click)="menu.toggle()"
  >
    {{ 'about.menuLabel' | transloco }}
    <span class="chev" aria-hidden="true">▾</span>
  </button>

  @if (menu.open()) {
    <div appMenuPanel class="about-dropdown">
      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="about-option"
        [attr.aria-disabled]="checking()"
        (click)="checkUpdates()"
      >
        {{ 'about.checkUpdates' | transloco }}
        <!-- aria-live : le résultat arrive après le clic, il doit être annoncé
             sans déplacer le focus, resté sur cette entrée. -->
        <span class="about-option-status" aria-live="polite">
          @if (checkStatusRef(); as ref) {
            {{ ref.key | transloco }}
          }
        </span>
      </button>

      <button appMenuItem type="button" role="menuitem" class="about-option" (click)="openDialog()">
        {{ 'about.openAbout' | transloco }}
      </button>
    </div>
  }
</div>

@if (dialogOpen()) {
  <app-about-dialog (closed)="closeDialog()" />
}
