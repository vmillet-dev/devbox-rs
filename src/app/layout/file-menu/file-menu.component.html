<div class="file-wrapper">
  <button
    appMenuAnchor
    type="button"
    class="file-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    (click)="menu.toggle()"
  >
    {{ 'file.menuLabel' | transloco }}
    <span class="chev" aria-hidden="true">▾</span>
  </button>

  @if (menu.open()) {
    <div appMenuPanel class="file-dropdown">
      @for (entry of registry.entries(); track entry.id) {
        <button
          appMenuItem
          type="button"
          role="menuitem"
          class="file-option"
          [attr.aria-disabled]="entry.disabled?.() ?? false"
          (click)="run(entry)"
        >
          {{ entry.labelKey | transloco }}
        </button>
      }

      @if (registry.entries().length > 0) {
        <hr class="file-separator" />
      }

      <button appMenuItem type="button" role="menuitem" class="file-option" (click)="openSettings()">
        {{ 'file.preferences' | transloco }}
      </button>

      <button
        appMenuItem
        type="button"
        role="menuitem"
        class="file-option danger"
        [class.confirming]="confirmingQuit()"
        (click)="onQuit()"
      >
        {{ (confirmingQuit() ? 'file.quitConfirm' : 'file.quit') | transloco }}
      </button>
    </div>
  }
</div>

@if (settingsOpen()) {
  <app-settings-dialog (closed)="closeSettings()" />
}
