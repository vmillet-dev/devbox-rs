@if (notifier.status(); as status) {
  <!-- role="status" and not "alert": a success does not justify interrupting a
       screen reader. -->
  <div class="status-toast" role="status">
    <span class="status-text">{{ status.key | transloco: status.params }}</span>
    <button
      type="button"
      class="status-dismiss"
      [attr.aria-label]="'errors.dismiss' | transloco"
      (click)="notifier.dismiss()"
    >
      <span aria-hidden="true">✕</span>
    </button>
  </div>
}
