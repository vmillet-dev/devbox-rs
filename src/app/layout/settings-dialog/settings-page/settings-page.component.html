<div class="setting-groups">
  <section class="setting-group">
    <h4 class="setting-group-title">{{ 'settings.appearance.title' | transloco }}</h4>

    <div class="setting-row">
      <label class="setting-label" for="setting-theme">
        {{ 'settings.appearance.theme' | transloco }}
      </label>
      <select id="setting-theme" class="setting-select" (change)="onTheme($event)">
        @for (choice of themes; track choice) {
          <option [value]="choice" [selected]="choice === settings.theme()">
            {{ 'settings.theme.' + choice | transloco }}
          </option>
        }
      </select>
    </div>

    <div class="setting-row">
      <label class="setting-label" for="setting-density">
        {{ 'settings.appearance.density' | transloco }}
      </label>
      <select id="setting-density" class="setting-select" (change)="onDensity($event)">
        @for (choice of densities; track choice) {
          <option [value]="choice" [selected]="choice === settings.density()">
            {{ 'settings.density.' + choice | transloco }}
          </option>
        }
      </select>
    </div>
  </section>

  <section class="setting-group">
    <h4 class="setting-group-title">{{ 'settings.behavior.title' | transloco }}</h4>

    <div class="setting-row">
      <label class="setting-label" for="setting-autostart">
        {{ 'settings.behavior.startWithSystem' | transloco }}
      </label>
      <input
        id="setting-autostart"
        class="setting-switch"
        type="checkbox"
        [checked]="settings.startWithSystem()"
        (change)="onStartWithSystem($event)"
      />
    </div>

    <div class="setting-row">
      <label class="setting-label" for="setting-minimize-to-tray">
        {{ 'settings.behavior.minimizeToTray' | transloco }}
      </label>
      <input
        id="setting-minimize-to-tray"
        class="setting-switch"
        type="checkbox"
        [checked]="settings.minimizeToTray()"
        (change)="onMinimizeToTray($event)"
      />
    </div>

    <div class="setting-row">
      <label class="setting-label" for="setting-close-to-tray">
        {{ 'settings.behavior.closeToTray' | transloco }}
      </label>
      <input
        id="setting-close-to-tray"
        class="setting-switch"
        type="checkbox"
        [checked]="settings.closeToTray()"
        (change)="onCloseToTray($event)"
      />
    </div>

    <p class="setting-note">{{ 'settings.behavior.trayNote' | transloco }}</p>
  </section>

  <section class="setting-group">
    <h4 class="setting-group-title">{{ 'settings.quickPaste.title' | transloco }}</h4>

    <div class="setting-row">
      <label class="setting-label" for="setting-shortcut">
        {{ 'settings.quickPaste.shortcut' | transloco }}
      </label>
      <div class="setting-shortcut">
        <!-- `readonly` and not `disabled`: the field must stay focusable, since
             it is what listens for the keystroke. -->
        <input
          id="setting-shortcut"
          class="setting-shortcut-input"
          type="text"
          readonly
          [value]="settings.paletteShortcut()"
          [attr.aria-describedby]="'setting-shortcut-hint'"
          (keydown)="onShortcutKeydown($event)"
        />
        <button
          type="button"
          class="setting-shortcut-reset"
          [disabled]="settings.paletteShortcut() === defaultShortcut"
          (click)="resetShortcut()"
        >
          {{ 'settings.quickPaste.shortcutReset' | transloco }}
        </button>
      </div>
    </div>

    <p id="setting-shortcut-hint" class="setting-note">
      {{ 'settings.quickPaste.shortcutHint' | transloco }}
    </p>

    <div class="setting-row">
      <label class="setting-label" for="setting-pinned-first">
        {{ 'settings.quickPaste.showPinnedFirst' | transloco }}
      </label>
      <input
        id="setting-pinned-first"
        class="setting-switch"
        type="checkbox"
        [checked]="settings.showPinnedFirst()"
        (change)="onShowPinnedFirst($event)"
      />
    </div>
  </section>

  <section class="setting-group">
    <h4 class="setting-group-title">{{ 'settings.notifications.title' | transloco }}</h4>

    <div class="setting-row">
      <label class="setting-label" for="setting-copy-confirmation">
        {{ 'settings.notifications.copyConfirmation' | transloco }}
      </label>
      <input
        id="setting-copy-confirmation"
        class="setting-switch"
        type="checkbox"
        [checked]="settings.copyConfirmation()"
        (change)="onCopyConfirmation($event)"
      />
    </div>
  </section>
</div>
