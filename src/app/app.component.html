<main class="page">
  <header class="hero">
    <span class="hero__badge">DevBox</span>
    <h1 class="hero__title">Le couteau suisse du développeur</h1>
    <p class="hero__subtitle">
      Notes rapides, hashing, encodage — un seul outil, propulsé par Rust.
    </p>
  </header>

  <section class="panel" aria-labelledby="demo-title">
    <h2 id="demo-title" class="panel__title">Test de liaison Angular ⇄ Rust</h2>
    <p class="panel__hint">
      Ce formulaire appelle la commande Rust <code>saluer</code> via <code>invoke()</code>.
    </p>

    <form class="panel__form" (ngSubmit)="saluer()">
      <label for="nom" class="panel__label">Votre prénom</label>
      <div class="panel__row">
        <input
          id="nom"
          name="nom"
          type="text"
          class="panel__input"
          placeholder="ex. Ada"
          [(ngModel)]="nom"
          autocomplete="off"
        />
        <button type="submit" class="panel__button" [disabled]="!nom.trim() || chargement">
          {{ chargement ? 'Envoi…' : 'Saluer' }}
        </button>
      </div>
    </form>

    @if (reponse || erreur) {
      <div class="console" [class.console--error]="erreur">
        <span class="console__prompt">&gt;</span>
        <span class="console__text">{{ erreur || reponse }}</span>
      </div>
    }
  </section>
</main>
