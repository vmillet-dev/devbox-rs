<div class="undo-bar" data-testid="undo-bar" role="status">
  <span class="undo-text">{{ message() | transloco: { count: action().count } }}</span>
  <button type="button" class="undo-action" data-testid="undo-restore" (click)="undone.emit()">
    {{ 'undo.restore' | transloco }}
  </button>
  <button
    type="button"
    class="undo-dismiss"
    data-testid="undo-dismiss"
    [attr.aria-label]="'undo.dismiss' | transloco"
    (click)="dismissed.emit()"
  >
    <span aria-hidden="true">✕</span>
  </button>
</div>
