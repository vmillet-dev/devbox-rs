<!-- Toggle buttons rather than a radiogroup: `aria-pressed` carries the state without
     imposing the arrow navigation a real radio group needs. -->
<div class="filter-chips" role="group" [attr.aria-label]="'filters.groupLabel' | transloco">
  @for (filter of filters; track filter.key) {
    <button
      type="button"
      class="chip"
      data-testid="filter-chip"
      [attr.data-filter]="filter.key"
      [class.active]="active() === filter.key"
      [attr.aria-pressed]="active() === filter.key"
      (click)="filterChanged.emit(filter.key)"
    >
      @if (filter.icon) {
        <span aria-hidden="true">{{ filter.icon }}</span>
      }
      {{ filter.labelKey | transloco }}
    </button>
  }
</div>
