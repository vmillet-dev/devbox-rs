<label class="search-bar">
  <!-- Hidden from assistive technology: a <label> aggregates all its text content, and
       the field's accessible name would become "🔍 Ctrl+K". -->
  <span aria-hidden="true">🔍</span>
  <input
    #searchInput
    type="search"
    data-testid="search-input"
    [attr.aria-label]="'notes.searchLabel' | transloco"
    [placeholder]="'notes.searchPlaceholder' | transloco"
    [value]="query()"
    (input)="onInput(searchInput.value)"
  />
  <!-- `!== null` and not a truthiness check: zero results is the answer that matters most. -->
  @if (matched() !== null) {
    <span class="count" data-testid="search-matched">{{
      'notes.searchMatched' | transloco: { count: matched() }
    }}</span>
  } @else {
    <span class="kbd" aria-hidden="true">{{ shortcutHint }}</span>
  }
</label>
