<div class="space-switch-wrapper">
  <button
    appMenuAnchor
    type="button"
    class="space-switch"
    data-testid="space-switcher"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    [attr.aria-label]="'notes.spaceSwitcherLabel' | transloco"
    (click)="toggle()"
  >
    <span class="space-dot" aria-hidden="true"></span>
    {{ activeSpace()?.name ?? ('notes.allSpaces' | transloco) }}
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  @if (menu.open()) {
    <div class="space-dropdown" data-testid="space-dropdown">
      @if (editing(); as edited) {
        <!-- The edit panel replaces the menu, like the create form. -->
        <div class="space-edit-panel">
          <p class="space-edit-title">{{ edited.name }}</p>

          <button
            type="button"
            class="space-pin-toggle"
            data-testid="space-pin"
            [class.on]="edited.pinned"
            [attr.aria-pressed]="edited.pinned"
            (click)="pinRequested.emit(edited.id)"
          >
            <span aria-hidden="true">📌</span>
            {{ (edited.pinned ? 'notes.unpinSpace' : 'notes.pinSpace') | transloco }}
          </button>

          <form class="space-create-form" (submit)="submitRename($event, renameInput.value)">
            <input
              #renameInput
              type="text"
              class="space-create-input"
              data-testid="space-rename-input"
              [attr.aria-label]="'notes.renameSpaceLabel' | transloco"
              [value]="edited.name"
            />
            <button type="submit" class="space-create-submit" data-testid="space-rename-submit">
              {{ 'notes.renameSpaceSubmit' | transloco }}
            </button>
          </form>

          @if (moveTargets().length > 0) {
            <div class="space-delete-group">
              <label class="space-delete-label" [attr.for]="'space-move-target'">
                {{ 'notes.moveNotesTo' | transloco }}
              </label>
              <div class="space-delete-row">
                <!-- The target is mandatory: the space leaves with its notes
                     (ON DELETE CASCADE) if nobody takes them in. -->
                <select
                  #targetSelect
                  id="space-move-target"
                  data-testid="space-move-target"
                  class="space-create-input"
                >
                  @for (target of moveTargets(); track target.id) {
                    <option [value]="target.id">{{ target.name }}</option>
                  }
                </select>
                <button
                  type="button"
                  class="space-create-submit space-delete-submit"
                  data-testid="space-delete"
                  [class.confirming]="confirmingDelete()"
                  (click)="onDeleteClick(targetSelect.value)"
                >
                  {{ (confirmingDelete() ? 'notes.deleteSpaceConfirm' : 'notes.deleteSpace') | transloco }}
                </button>
              </div>
            </div>
          } @else {
            <p class="space-delete-blocked" data-testid="space-delete-blocked">
              {{ 'notes.deleteSpaceNeedsAnother' | transloco }}
            </p>
          }
        </div>
      } @else if (creating()) {
        <!-- The form replaces the menu rather than adding to it: an input inside a
             role="menu" is neither valid ARIA nor navigable the way options are. -->
        <form class="space-create-form" (submit)="submitNewSpace($event, nameInput.value)">
          <input
            #nameInput
            type="text"
            class="space-create-input"
            data-testid="space-create-input"
            [attr.aria-label]="'notes.newSpaceLabel' | transloco"
            [placeholder]="'notes.newSpacePlaceholder' | transloco"
          />
          <button type="submit" class="space-create-submit" data-testid="space-create-submit">
            {{ 'notes.newSpaceSubmit' | transloco }}
          </button>
        </form>
      } @else {
        <div appMenuPanel class="space-menu">
          <button
            appMenuItem
            type="button"
            role="menuitemradio"
            class="space-option"
            data-testid="space-option-all"
            [class.active]="activeSpace() === null"
            [attr.aria-checked]="activeSpace() === null"
            (click)="select(null)"
          >
            {{ 'notes.allSpaces' | transloco }}
          </button>
          @for (space of spaces(); track space.id) {
            <!-- `role="none"`: a bare container between the menu and its items would
                 break the relationship screen readers expect. -->
            <div class="space-row" role="none">
              <button
                appMenuItem
                type="button"
                role="menuitemradio"
                class="space-option"
                data-testid="space-option"
                [attr.data-space-id]="space.id"
                [class.active]="space.id === activeSpace()?.id"
                [attr.aria-checked]="space.id === activeSpace()?.id"
                (click)="select(space)"
              >
                @if (space.pinned) {
                  <span class="space-pin-mark" aria-hidden="true">📌</span>
                  <span class="visually-hidden">{{ 'notes.pinnedSpace' | transloco }}</span>
                }
                {{ space.name }}
              </button>
              <button
                type="button"
                role="menuitem"
                class="space-edit-trigger"
                data-testid="space-edit"
                [attr.data-space-id]="space.id"
                [attr.aria-label]="'notes.spaceOptionsLabel' | transloco: { name: space.name }"
                (click)="startEditing(space)"
              >
                <span aria-hidden="true">⋯</span>
              </button>
            </div>
          }
          <button
            appMenuItem
            type="button"
            role="menuitem"
            class="space-option space-create-trigger"
            data-testid="space-create-open"
            (click)="startCreating()"
          >
            <span aria-hidden="true">＋</span> {{ 'notes.newSpace' | transloco }}
          </button>
        </div>
      }
    </div>
  }
</div>
