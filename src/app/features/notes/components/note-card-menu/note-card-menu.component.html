<button
  #trigger
  type="button"
  class="card-menu-trigger"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'notes.noteOptionsLabel' | transloco: { title: noteTitle() }"
  (click)="toggle($event)"
>
  <span aria-hidden="true">⋯</span>
</button>

@if (open()) {
  <!-- Écoute déléguée : le conteneur n'est jamais focusé, ce sont ses items qui
       le sont, et l'événement remonte jusqu'ici. Le rendre focusable ajouterait
       un arrêt de tabulation parasite dans le menu. -->
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
  <div class="card-menu" role="menu" (keydown)="onMenuKeydown($event)">
    @if (moveTargets().length > 0) {
      <p class="card-menu-title">{{ 'notes.moveToSpace' | transloco }}</p>
      @for (target of moveTargets(); track target.id) {
        <button #item type="button" role="menuitem" class="card-menu-item" (click)="move(target.id)">
          {{ target.name }}
        </button>
      }
    }
    <button
      #item
      type="button"
      role="menuitem"
      class="card-menu-item card-menu-delete"
      [class.confirming]="confirmingDelete()"
      (click)="onDeleteClick()"
    >
      <span aria-hidden="true">🗑</span>
      {{ (confirmingDelete() ? 'editor.deleteConfirm' : 'editor.delete') | transloco }}
    </button>
  </div>
}
