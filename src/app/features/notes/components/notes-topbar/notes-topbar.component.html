<div class="topbar">
  <app-space-switcher [spaces]="spaces()" [activeSpace]="activeSpace()" (spaceChanged)="spaceChanged.emit($event)" />
  <app-search-box [query]="searchQuery()" (queryChange)="searchQueryChanged.emit($event)" />
  <app-filter-chips [active]="activeFilter()" (filterChanged)="filterChanged.emit($event)" />
  <button type="button" class="new-note-btn" (click)="newNoteRequested.emit()">+ Nouvelle note</button>
</div>
