<div class="space-switch-wrapper">
  <button
    #trigger
    type="button"
    class="space-switch"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="'notes.spaceSwitcherLabel' | transloco"
    (click)="toggle()"
  >
    <span class="space-dot" aria-hidden="true"></span>
    {{ activeSpace()?.name ?? ('notes.allSpaces' | transloco) }}
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  @if (open()) {
    <div class="space-dropdown">
      @if (creating()) {
        <!-- Le formulaire remplace le menu au lieu de s'y ajouter : un champ de
             saisie dans un role="menu" n'est ni valide ARIA, ni navigable de la
             même façon que des options. -->
        <form class="space-create-form" (submit)="submitNewSpace($event, nameInput.value)">
          <input
            #nameInput
            type="text"
            class="space-create-input"
            [attr.aria-label]="'notes.newSpaceLabel' | transloco"
            [placeholder]="'notes.newSpacePlaceholder' | transloco"
          />
          <button type="submit" class="space-create-submit">
            {{ 'notes.newSpaceSubmit' | transloco }}
          </button>
        </form>
      } @else {
        <!-- Écoute déléguée : le conteneur n'est jamais focusé, ce sont ses options
             qui le sont, et l'événement remonte jusqu'ici. Le rendre focusable
             ajouterait un arrêt de tabulation parasite dans le menu. -->
        <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
        <div class="space-menu" role="menu" (keydown)="onMenuKeydown($event)">
          <button
            #option
            type="button"
            role="menuitemradio"
            class="space-option"
            [class.active]="activeSpace() === null"
            [attr.aria-checked]="activeSpace() === null"
            (click)="select(null)"
          >
            {{ 'notes.allSpaces' | transloco }}
          </button>
          @for (space of spaces(); track space.id) {
            <button
              #option
              type="button"
              role="menuitemradio"
              class="space-option"
              [class.active]="space.id === activeSpace()?.id"
              [attr.aria-checked]="space.id === activeSpace()?.id"
              (click)="select(space)"
            >
              {{ space.name }}
            </button>
          }
          <button
            #option
            type="button"
            role="menuitem"
            class="space-option space-create-trigger"
            (click)="startCreating()"
          >
            <span aria-hidden="true">＋</span> {{ 'notes.newSpace' | transloco }}
          </button>
        </div>
      }
    </div>
  }
</div>
