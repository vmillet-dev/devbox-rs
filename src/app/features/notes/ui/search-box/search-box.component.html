<label class="search-bar">
  <!-- Decorations hidden from assistive technology: a <label> aggregates all
       its text content, and the field's accessible name would become
       "🔍 Ctrl+K". -->
  <span aria-hidden="true">🔍</span>
  <input
    #searchInput
    type="search"
    [attr.aria-label]="'notes.searchLabel' | transloco"
    [placeholder]="'notes.searchPlaceholder' | transloco"
    [value]="query()"
    (input)="onInput(searchInput.value)"
  />
  <span class="kbd" aria-hidden="true">{{ shortcutHint }}</span>
</label>
