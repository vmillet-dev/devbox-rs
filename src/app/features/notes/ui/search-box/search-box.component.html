<label class="search-bar">
  <!-- Décorations masquées aux technologies d'assistance : un <label> agrège
       tout son contenu textuel, le nom accessible du champ deviendrait
       « 🔍 Ctrl+K ». -->
  <span aria-hidden="true">🔍</span>
  <input
    #searchInput
    type="search"
    [attr.aria-label]="'notes.searchLabel' | transloco"
    [placeholder]="'notes.searchPlaceholder' | transloco"
    [value]="query()"
    (input)="onInput(searchInput.value)"
  />
  <span class="kbd" aria-hidden="true">{{ shortcutHint }}</span>
</label>
