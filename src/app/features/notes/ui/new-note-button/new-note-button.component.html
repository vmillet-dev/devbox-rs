<div class="new-note-wrapper">
  <button type="button" class="new-note-btn" (click)="create('snippet')">
    {{ 'notes.newNote' | transloco }}
  </button>

  <!-- The chevron carries `appMenuAnchor`: it opened the menu, so focus returns to it. -->
  <button
    appMenuAnchor
    type="button"
    class="new-note-caret"
    aria-haspopup="menu"
    [attr.aria-expanded]="menu.open()"
    [attr.aria-label]="'notes.newNoteKindLabel' | transloco"
    (click)="menu.toggle()"
  >
    <span aria-hidden="true">▾</span>
  </button>

  @if (menu.open()) {
    <div appMenuPanel class="new-note-menu">
      <button appMenuItem type="button" class="new-note-option" (click)="create('snippet')">
        {{ 'notes.newSnippet' | transloco }}
      </button>
      <button appMenuItem type="button" class="new-note-option" (click)="create('checklist')">
        {{ 'notes.newChecklist' | transloco }}
      </button>
    </div>
  }
</div>
