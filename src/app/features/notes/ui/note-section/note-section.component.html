<section class="canvas-section" [attr.aria-labelledby]="headingId()">
  <h2 class="canvas-section-title" [id]="headingId()">
    {{ titleKey() | transloco }}
    <!-- Compact on purpose: a line break between the interpolations would leave a stray space in the rendered text, which the prettier-ignore below keeps out. -->
    <!-- prettier-ignore -->
    <span class="n">· {{ section().notes.length }}@if (section().hasExpiringNotes) { · {{ 'sections.expiringHint' | transloco }}}</span>
  </h2>
  <div class="card-grid">
    @for (note of section().notes; track note.id) {
      <app-note-card
        [note]="note"
        [selected]="note.id === selectedNoteId()"
        [focused]="note.id === focusedNoteId()"
        [checked]="checkedIds().has(note.id)"
        [spaces]="spaces()"
        (opened)="noteOpened.emit($event)"
        (checkToggled)="noteChecked.emit($event)"
        (moveRequested)="noteMoved.emit($event)"
        (deleteRequested)="noteDeleted.emit($event)"
        (fillRequested)="fillRequested.emit($event)"
        (itemToggled)="itemToggled.emit($event)"
      />
    }
    @if (section().showCreateGhost) {
      <button type="button" class="card ghost" (click)="createRequested.emit()">
        <span class="ghost-plus" aria-hidden="true">+</span>
        <span>{{ 'notes.createOrPaste' | transloco }}</span>
      </button>
    }
  </div>
</section>
