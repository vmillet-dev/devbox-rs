<!-- A non-interactive tag is a plain label: leaving it a button role would
     announce an action that does not exist and make it keyboard-reachable. -->
@if (interactive()) {
  <button
    type="button"
    class="tag-pill"
    [class.on]="active()"
    [attr.aria-pressed]="active()"
    (click)="onClick()"
  >
    #{{ label() }}
  </button>
} @else {
  <span class="tag-pill static">#{{ label() }}</span>
}
